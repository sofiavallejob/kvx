[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdkv"
version = "0.3.0"
description = "Python client for the kvx/dict JSON dictionary in Pure Data"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Sofia Vallejo Budziszewski" }]
dependencies = []

[tool.setuptools]
packages = ["pdkv"]
